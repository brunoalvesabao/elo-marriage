<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="apple-mobile-web-app-title" content="ELO">

<meta name="theme-color" content="#141816" media="(prefers-color-scheme: dark)">
<meta name="description" content="ELO — Dois caminhos, um só elo. Evolução, laço e olhar de cuidado: uma ferramenta para casais acompanharem e fortalecerem o relacionamento.">
<title>ELO · Dois caminhos, um só elo.</title>
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>

<script src="config.js"></script>
<style>
:root{
  --bg:#F6F3EE; --surface:#FFFFFF; --surface-2:#F0ECE5; --line:#E4DED4;
  --text:#1F2523; --muted:#6B706C; --faint:#9CA09B;
  --a:#2F5D62; --a-soft:#DCE8E6; --b:#B9785A; --b-soft:#F3E3DA;
  --accent:#2F5D62; --good:#3E7B5A; --good-soft:#E0EFE5;
  --warn:#A87522; --warn-soft:#F6EBD6; --alert:#A4513F; --alert-soft:#F5E1DB;
  --shadow:0 1px 2px rgba(30,30,20,.04),0 4px 16px rgba(30,30,20,.05);
  --radius:18px; --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,-apple-system,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#141816; --surface:#1C211F; --surface-2:#232927; --line:#2E3532;
    --text:#ECEAE4; --muted:#A3A8A3; --faint:#6F756F;
    --a:#7FB3AE; --a-soft:#22332F; --b:#E0A585; --b-soft:#3A2A22;
    --accent:#7FB3AE; --good:#7CC39A; --good-soft:#1F3328;
    --warn:#E0B464; --warn-soft:#3A2F1A; --alert:#E38F7B; --alert-soft:#3D2621;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);overscroll-behavior-y:none}
body{font-family:var(--sans);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-bottom:calc(84px + var(--safe-b));min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);padding-top:var(--safe-t)}
/* cobre o espaço acima do cabeçalho quando a barra do Safari encolhe ou a página é puxada */
header.top::before{content:'';position:absolute;left:0;right:0;bottom:100%;height:120px;background:var(--bg)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{height:24px;width:auto;flex:none}
.brand b{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:.02em}
.who{display:flex;align-items:center;gap:8px;max-width:55%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:13px;font-weight:600}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.who .nm{overflow:hidden;text-overflow:ellipsis}
.avatar{flex:none}
.av-a{background:var(--a)} .av-b{background:var(--b)}
@media (prefers-color-scheme:dark){.avatar{color:#141816}}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(23px,6.6vw,28px);line-height:1.15;letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.25}
h3{font-size:14px;font-weight:600}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.hero{padding:18px 0 8px}
.hero p{color:var(--muted);margin-top:6px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin:12px 0}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.grid2 .card{margin:0}
.stat .v{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1;margin-top:6px}
.stat .v small{font-size:14px;color:var(--muted);font-family:var(--sans);font-weight:500}
.stat .s{font-size:12px;color:var(--muted);margin-top:4px}
.up{color:var(--good)} .down{color:var(--alert)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:14px;font-weight:600;font-size:15px;transition:transform .12s ease,opacity .12s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--bg)}
.btn-ghost{background:var(--surface-2);color:var(--text)}
.btn-line{border:1px solid var(--line);background:var(--surface)}
.btn-sm{height:36px;padding:0 14px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.row>*{min-width:0}
.stack>*+*{margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;white-space:nowrap;flex:none;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.pill.wrap{white-space:normal;height:auto;min-height:26px;padding:3px 10px;flex:0 1 auto}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.alert{background:var(--alert-soft);color:var(--alert)}
.pill.a{background:var(--a-soft);color:var(--a)} .pill.b{background:var(--b-soft);color:var(--b)}
.dots{display:inline-flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.dots.a i.on{background:var(--a)} .dots.b i.on{background:var(--b)}
.dim{padding:12px 0;border-top:1px solid var(--line)}
.dim:first-child{border-top:none;padding-top:0}
.dim-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dim-name{font-weight:600;font-size:14px}
.dim-scores{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.dim-scores .r{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.dim-scores .r span:first-child{width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comment{margin-top:8px;font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 10px}
.signal{display:flex;gap:12px;padding:12px;border-radius:14px;margin-top:8px}
.signal .ic{font-size:18px;line-height:1.3}
.signal b{display:block;font-size:14px}
.signal p{font-size:13px;margin-top:2px;opacity:.9}
.signal.alert{background:var(--alert-soft);color:var(--alert)}
.signal.warn{background:var(--warn-soft);color:var(--warn)}
.signal.good{background:var(--good-soft);color:var(--good)}
.signal.info{background:var(--a-soft);color:var(--a)}
.quote{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin-top:10px}
.quote .by{font-size:12px;font-weight:600;margin-bottom:2px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs .wrap{display:flex;justify-content:space-around;height:64px;align-items:center;padding:0 4px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--faint);padding:6px 0}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}
label.f{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
/* 16px evita o zoom automático do Safari ao tocar no campo */
input.in,textarea.in,select.in{display:block;width:100%;min-width:0;-webkit-appearance:none;appearance:none;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:16px;line-height:1.4;outline:none;transition:border .15s}
input.in{height:44px}
select.in{height:44px;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input.in[type=date]{display:flex;align-items:center}
input.in::-webkit-date-and-time-value{text-align:left}
input.in:focus,textarea.in:focus,select.in:focus{border-color:var(--accent)}
textarea.in{min-height:88px;resize:vertical;line-height:1.45}
textarea.in.short{min-height:0;resize:none}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.scale button{height:46px;border-radius:12px;background:var(--surface-2);font-weight:700;font-size:16px;transition:all .12s}
.scale button.on{background:var(--accent);color:var(--bg);transform:scale(1.04)}
.scale-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{height:38px;padding:0 14px;border-radius:999px;background:var(--surface-2);font-size:14px;font-weight:500;border:1px solid transparent}
.chip.on{background:var(--a-soft);color:var(--a);border-color:var(--a)}
.moods{display:grid;gap:8px;margin-top:10px}
.mood{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:var(--surface-2);text-align:left;border:1.5px solid transparent;font-weight:500}
.mood .e{font-size:24px}
.mood.on{border-color:var(--accent);background:var(--a-soft)}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 16px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.hints{margin-top:8px;padding-left:18px;font-size:13px;color:var(--muted)}
.hints li+li{margin-top:2px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.yn button{height:42px;border-radius:12px;background:var(--surface-2);font-weight:600}
.yn button.on.y{background:var(--alert-soft);color:var(--alert)}
.yn button.on.n{background:var(--good-soft);color:var(--good)}
.list-item{padding:14px 0;border-top:1px solid var(--line)}
.list-item:first-child{border-top:none;padding-top:0}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.menu button{display:flex;width:100%;align-items:center;gap:14px;padding:14px 4px;border-top:1px solid var(--line);text-align:left}
.menu button:first-child{border-top:none}
.menu .mi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);font-size:18px}
.menu .mt{flex:1}
.menu .mt b{display:block;font-size:15px;font-weight:600}
.menu .mt span{font-size:12px;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:14px;font-weight:600;padding:12px 0 0}
.empty{text-align:center;padding:24px 12px;color:var(--muted);font-size:14px}
.chart-box{position:relative;width:100%}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,10,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.modal{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + var(--safe-b));max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain;animation:up .25s ease}
@media (min-width:640px){.modal-bg{align-items:center}.modal{border-radius:22px}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.view{animation:fade .25s}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);text-align:center;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;animation:toastin .2s}
@keyframes toastin{from{transform:translate(-50%,30px);opacity:0}}
.onb{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:calc(28px + var(--safe-t)) 16px calc(28px + var(--safe-b))}
body.no-tabs{padding-bottom:0}
.onb .card{margin:14px 0}
.onb .logo-big{height:56px;width:auto;align-self:flex-start;margin-bottom:20px}
.rule{background:var(--surface);border-radius:var(--radius);padding:20px;margin:22px 0;border:1px solid var(--line)}
.rule h3{font-family:var(--serif);font-size:18px;margin-bottom:6px}
.check{display:flex;gap:12px;align-items:flex-start;margin:20px 0 16px;padding:4px 0;font-size:14px;cursor:pointer;-webkit-user-select:none;user-select:none}
.check input{width:22px;height:22px;accent-color:var(--accent);margin-top:2px;flex:none}
.steps li{margin:10px 0 0 18px;font-size:14px}
.steps li b{font-weight:600}
.resource{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid color-mix(in srgb,currentColor 20%,transparent)}
.resource:first-of-type{border-top:none}
.resource a{font-weight:700;color:inherit;text-decoration:none;font-size:18px;white-space:nowrap;flex:none}
.pin{display:flex;gap:10px;justify-content:center;margin:16px 0}
.pin input{width:min(52px,18vw);height:58px;text-align:center;font-size:24px;font-weight:700;border-radius:14px;background:var(--surface-2);border:1.5px solid transparent;outline:none}
.pin input:focus{border-color:var(--accent)}
.hidden{display:none!important}
#jc::placeholder{text-transform:none;letter-spacing:normal}
.or{display:flex;align-items:center;gap:12px;margin:6px 0;color:var(--muted);font-size:13px;font-weight:600}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
@media (max-width:360px){.card{padding:15px}.grid2{gap:10px}.stat .v{font-size:26px}.seg button{font-size:12px}nav.tabs button{font-size:10px}}
.tagline{font-family:var(--serif);font-size:clamp(17px,4.8vw,19px);font-style:italic;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   ELO — Alinhamento. Cuidado. Evolução.
   Arquivo único. Sem Supabase configurado (config.js), os dados ficam no
   aparelho (localStorage). Com Supabase, cada pessoa entra com a própria
   conta e os dados do casal sincronizam pela nuvem (ver Cloud).
   ========================================================================= */

const APP_VERSION = '1.0.0';
const STORAGE_KEY = 'elo.v1';

/* ---------- Dimensões ---------- */
const DIMS = [
  { id:'comunicacao', name:'Comunicação', short:'Comunicação',
    desc:'Escuta, tom de voz, críticas e reclamações, e a capacidade de falar de assuntos difíceis.',
    hints:['Fui ouvido(a) quando falei?','As conversas terminaram em solução ou em reclamação?','Conseguimos discordar sem atacar?'] },
  { id:'seguranca', name:'Segurança Emocional', short:'Segurança',
    desc:'Sentir-se respeitado(a) e livre para falar, sem medo de gritos, humilhação ou explosões.',
    hints:['Houve gritos ou ofensas nesta semana?','Senti que podia discordar com tranquilidade?','Me senti respeitado(a) na frente das crianças?'] },
  { id:'familia', name:'Família e Filhos', short:'Família',
    desc:'Clima da casa, paciência e respeito com todas as crianças, regras combinadas e parceria na criação.',
    hints:['As crianças viveram uma casa tranquila nesta semana?','Estivemos alinhados nas regras e na disciplina?','Todas as crianças foram tratadas com o mesmo cuidado?'] },
  { id:'parceria', name:'Parceria', short:'Parceria',
    desc:'Divisão de tarefas, dinheiro e decisões, e o reconhecimento do esforço de cada um.',
    hints:['A carga da casa pareceu justa?','Meu esforço foi percebido?','Percebi e agradeci o esforço do outro?'] },
  { id:'presenca', name:'Presença e Conexão', short:'Presença',
    desc:'Tempo de qualidade, atenção sem celular, interesse genuíno pelo dia do outro.',
    hints:['Tivemos algum tempo só nosso?','O celular atrapalhou nossos momentos?','Me senti interessante para o outro?'] },
  { id:'afeto', name:'Afeto e Intimidade', short:'Intimidade',
    desc:'Carinho, toque, desejo e a liberdade de falar sobre necessidades — sempre com respeito aos limites e ao consentimento.',
    hints:['Houve carinho fora do contexto sexual?','Consegui falar do que desejo sem pressão nem culpa?','Um "não" foi recebido com respeito, e um convite com gentileza?'] },
  { id:'confianca', name:'Confiança e História', short:'Confiança',
    desc:'Transparência, feridas antigas, perdão e a reconstrução da confiança.',
    hints:['Me senti seguro(a) sobre a lealdade do outro?','Feridas antigas voltaram nas discussões?','Fomos transparentes um com o outro?'] },
  { id:'reparacao', name:'Reparação e Reconciliação', short:'Reparação',
    desc:'O que acontece depois do conflito: voltar a conversar, assumir a própria parte, pedir e aceitar desculpas.',
    hints:['Depois de brigar, voltamos a conversar?','Reconheci a minha parcela de responsabilidade?','Quanto tempo ficamos afastados?'] },
  { id:'proposito', name:'Propósito e Valores', short:'Propósito',
    desc:'Projeto de vida, fé e princípios, futuro da família e objetivos em comum.',
    hints:['Estamos sonhando algo juntos?','Nossos valores guiaram as decisões desta semana?','Sinto que caminhamos na mesma direção?'] }
];
const SCALE_LABELS = {1:'Muito difícil',2:'Difícil',3:'Oscilando',4:'Bem',5:'Muito bem'};
const MOODS = [
  {id:5,e:'❤️',t:'Muito conectado(a)'},
  {id:4,e:'🙂',t:'Bem'},
  {id:3,e:'😐',t:'Neutro(a)'},
  {id:2,e:'😔',t:'Distante ou magoado(a)'},
  {id:1,e:'🌧️',t:'Em crise'}
];
const FACTORS = ['Comunicação','Família','Dinheiro','Trabalho','Intimidade','Tempo juntos','Tarefas da casa','Confiança','Celular','Saúde','Outro'];
const SAFETY_Q = [
  {id:'fisica', q:'Nesta semana houve agressão física entre adultos da casa?'},
  {id:'crianca', q:'Alguma criança foi machucada, ameaçada ou exposta a agressão?'},
  {id:'medo', q:'Você sentiu medo de falar ou de estar em casa?'},
  {id:'ameaca', q:'Houve ameaças, humilhações ou xingamentos pesados?'}
];

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const validId = x => typeof x==='string' && /^[A-Za-z0-9_-]{1,64}$/.test(x);
const validWeek = x => typeof x==='string' && /^\d{4}-W\d{2}$/.test(x);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const fmt1 = n => n == null ? '—' : n.toFixed(1).replace('.',',');
const localISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayISO = () => localISO(new Date());   // data local (toISOString usaria UTC e viraria o dia às 21h no Brasil)
const fmtDate = iso => { if(!iso) return ''; const d = new Date(iso.length===10 ? iso+'T12:00:00' : iso); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}); };
const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);

function isoWeek(date = new Date()){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const y = d.getUTCFullYear();
  const w = Math.ceil(((d - Date.UTC(y,0,1)) / 86400000 + 1) / 7);
  return `${y}-W${String(w).padStart(2,'0')}`;
}
function weekLabel(key){
  const [y,w] = key.split('-W').map(Number);
  const jan4 = new Date(Date.UTC(y,0,4));
  const mon = new Date(jan4); mon.setUTCDate(jan4.getUTCDate() - ((jan4.getUTCDay()||7) - 1) + (w-1)*7);
  const sun = new Date(mon); sun.setUTCDate(mon.getUTCDate()+6);
  const f = d => d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',timeZone:'UTC'});
  return `${f(mon)} – ${f(sun)}`;
}
async function sha(s){
  try{ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('elo:'+s));
       return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  catch(e){ return 'plain:'+s; }
}

/* ---------- Nuvem (Supabase) ----------
   O estado S continua sendo a fonte da verdade na tela. A cada save(), o
   Cloud compara S com o último retrato enviado e grava só o que mudou.
   Regras de privacidade ficam no banco (supabase/schema.sql):
   - "Meu espaço" e respostas de segurança: só o próprio usuário vê;
   - check-in do outro: só aparece depois que eu respondi a mesma semana. */
const CFG = Object.fromEntries(Object.entries(window.ELO_CONFIG || {}).map(([k,v])=>[k, String(v||'').trim()]));   // tolera espaços/quebras coladas por engano
const CLOUD = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
const sb = CLOUD && window.supabase ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey) : null;
const Cloud = {
  status: CLOUD ? 'loading' : 'off',   // loading | auth | couple | ready | error | off
  error: '', user: null, couple: null, members: [],
  snap: new Map(), queue: Promise.resolve(), edits: 0,

  async init(){
    if(!sb){ this.status='error'; this.error='Não foi possível carregar o Supabase. Verifique a internet.'; render(); return; }
    sb.auth.onAuthStateChange((ev, session) => {
      // chamadas ao Supabase dentro deste callback podem travar; por isso o setTimeout
      if(ev==='SIGNED_OUT'){ this.user=null; this.couple=null; this.members=[]; this.snap=new Map(); S=Store.blank(); me=null; view='home'; sub=null; this.status='auth'; render(); }
      else if(ev==='PASSWORD_RECOVERY') setTimeout(newPasswordModal, 0);
      else if(session && (!this.user || this.user.id!==session.user.id)){ this.user=session.user; setTimeout(()=>this.refresh(), 0); }
    });
    const { data:{ session } } = await sb.auth.getSession();
    if(session){ if(!this.user){ this.user=session.user; await this.refresh(); } }
    else { this.status='auth'; render(); }
  },

  async refresh(){
    let ok=true;
    try{ await this.queue; await this.load(); }
    catch(e){
      ok=false; console.error(e);
      if(this.status==='ready') toast('Sem conexão com a nuvem');
      else { this.status='error'; this.error=e.message||String(e); }
    }
    render();
    return ok;
  },

  async load(){
    await this.queue;
    const edits = this.edits, uid = this.user.id;
    const m = await sb.from('members').select('couple_id,user_id,slot');
    if(m.error) throw m.error;
    const mine = (m.data||[]).find(x=>x.user_id===uid);
    if(!mine){ this.status='couple'; return; }
    const [c, it, pv, ws] = await Promise.all([
      sb.from('couples').select('*').eq('id', mine.couple_id).single(),
      sb.from('items').select('kind,id,data').eq('couple_id', mine.couple_id),
      sb.from('private_items').select('kind,id,data'),
      sb.rpc('week_status')
    ]);
    for(const r of [c,it,pv,ws]) if(r.error) throw r.error;
    // algo foi salvo enquanto buscávamos: espera o envio e busca de novo, senão a alteração se perderia
    if(edits!==this.edits) return this.load();
    this.couple=c.data; this.members=m.data; me=mine.slot;
    const T=Store.blank(); T.onboarded=true;
    T.partners=[{name:c.data.p0_name,pin:null},{name:c.data.p1_name,pin:null}];
    const round = wk => T.rounds[wk] || (T.rounds[wk]={id:wk,week:wk,entries:{}});
    // quem já respondeu, mesmo quando as respostas ainda estão ocultas
    (ws.data||[]).filter(w=>validWeek(w.week)&&(w.slot==='p0'||w.slot==='p1')).forEach(w=>{ round(w.week).entries[w.slot]={hidden:true,at:w.at}; });
    // ids entram em atributos onclick: descarta qualquer registro malformado
    (it.data||[]).forEach(x=>{
      if(!x.data||typeof x.data!=='object') return;
      if(x.kind==='entry'){ const [wk,slot]=x.id.split(':'); if(validWeek(wk)&&(slot==='p0'||slot==='p1')) round(wk).entries[slot]=x.data; }
      else if(validId(x.id)&&x.data.id===x.id) T[x.kind+'s'].push(x.data);
    });
    (pv.data||[]).forEach(x=>{
      if(x.kind==='note'){ if(validId(x.id)&&x.data&&x.data.id===x.id) T.private[me].push(x.data); }
      else if(x.kind==='safety'){ const e=T.rounds[x.id]&&T.rounds[x.id].entries[me]; if(e&&!e.hidden) e.safety=x.data; }
    });
    const by = k => (a,b)=>String(a[k]||'').localeCompare(String(b[k]||''));
    T.actions.sort(by('createdAt')); T.recognitions.sort(by('at')); T.conflicts.sort(by('date')); T.private[me].sort(by('at'));
    S=T;
    this.snap=new Map([...this.toItems()].map(([k,v])=>[k,JSON.stringify(v.data)]));
    this.status='ready';
  },

  // S → linhas do banco que EU posso gravar
  toItems(){
    const out=new Map();
    const put=(table,kind,id,data)=>out.set(`${table}|${kind}|${id}`,{table,kind,id,data});
    Object.values(S.rounds).forEach(r=>{
      const e=r.entries&&r.entries[me]; if(!e||e.hidden) return;
      const {safety,...pub}=e;
      put('items','entry',`${r.week}:${me}`,pub);
      if(safety&&Object.keys(safety).length) put('private_items','safety',r.week,safety);
    });
    ['action','recognition','conflict'].forEach(k=>(S[k+'s']||[]).forEach(x=>put('items',k,x.id,x)));
    (S.private[me]||[]).forEach(n=>put('private_items','note',n.id,n));
    put('couples','names','names',{p0_name:S.partners[0].name,p1_name:S.partners[1].name});
    return out;
  },

  sync(){
    if(this.status!=='ready') return this.queue;
    this.edits++;
    this.queue=this.queue.then(()=>this._sync()).catch(e=>{ console.error(e); toast('Não foi possível salvar na nuvem. Verifique a conexão.'); });
    return this.queue;
  },

  async _sync(){
    const cid=this.couple.id, uid=this.user.id, cur=this.toItems();
    const items=[], priv=[], done=[]; let names=null;
    cur.forEach((v,k)=>{
      const j=JSON.stringify(v.data); if(this.snap.get(k)===j) return;
      if(v.table==='couples') names=v.data;
      else if(v.table==='items') items.push({couple_id:cid,kind:v.kind,id:v.id,data:v.data});
      else priv.push({user_id:uid,kind:v.kind,id:v.id,data:v.data});
      done.push([k,j]);
    });
    const gone=[...this.snap.keys()].filter(k=>!cur.has(k));
    const ok=r=>{ if(r.error) throw r.error; };
    if(names) ok(await sb.from('couples').update(names).eq('id',cid));
    if(items.length) ok(await sb.from('items').upsert(items,{onConflict:'couple_id,kind,id'}));
    if(priv.length) ok(await sb.from('private_items').upsert(priv,{onConflict:'user_id,kind,id'}));
    for(const k of gone){
      const [table,kind,id]=k.split('|');
      if(table==='items') ok(await sb.from('items').delete().match({couple_id:cid,kind,id}));
      else if(table==='private_items') ok(await sb.from('private_items').delete().match({user_id:uid,kind,id}));
    }
    done.forEach(([k,j])=>this.snap.set(k,j));
    gone.forEach(k=>this.snap.delete(k));
  }
};

/* ---------- Cálculos ---------- */
function roundsSorted(){ return Object.values(S.rounds).sort((a,b)=>a.week.localeCompare(b.week)); }
function isComplete(r){ return r && r.entries && r.entries.p0 && r.entries.p1 && !r.entries.p0.hidden && !r.entries.p1.hidden; }
function completeRounds(){ return roundsSorted().filter(isComplete); }
function scoreOf(entry, dim){ return entry && entry.scores ? entry.scores[dim] : null; }
function roundMetrics(r){
  const dims = DIMS.map(d => {
    const a = scoreOf(r.entries.p0,d.id), b = scoreOf(r.entries.p1,d.id);
    return { ...d, a, b, mean:(a+b)/2, gap:Math.abs(a-b) };
  });
  const clima = avg(dims.map(d=>d.mean));
  const align = Math.round(100 - avg(dims.map(d=>d.gap)) / 4 * 100);
  const maxGap = [...dims].sort((x,y)=>y.gap-x.gap)[0];
  const priority = [...dims].sort((x,y)=>x.mean-y.mean || y.gap-x.gap)[0];
  return { dims, clima, align, maxGap, priority };
}
function trendFor(dimId, n=4){
  const rs = completeRounds().slice(-n);
  const vals = rs.map(r => dimId==='all' ? roundMetrics(r).clima : roundMetrics(r).dims.find(d=>d.id===dimId).mean);
  if(vals.length < 2) return {label:'Poucos dados', cls:''};
  const diff = vals[vals.length-1] - vals[0];
  const m = avg(vals), sd = Math.sqrt(avg(vals.map(v=>(v-m)**2)));
  if(diff >= .5) return {label:'Melhorando', cls:'good'};
  if(diff <= -.5) return {label:'Precisa de atenção', cls:'alert'};
  if(sd >= .7) return {label:'Oscilando', cls:'warn'};
  return {label:'Estável', cls:''};
}
function positiveRatio(days=30){
  const since = Date.now() - days*86400000;
  const pos = S.recognitions.filter(r=>new Date(r.at) >= since).length;
  const neg = S.conflicts.filter(c=>new Date(c.date+'T12:00:00') >= since).length;
  return {pos, neg};
}

/* Símbolo do ELO: duas fitas (uma para cada pessoa) formando um ∞ entrelaçado.
   Mesmo desenho de icons/icon.svg, gerado aqui para seguir as cores do tema. */
function eloMark(cls, id){
  const a=178, sy=1.42, gap=21, sw=cls==='logo'?30:20;
  const pt=t=>{ const s=Math.sin(t), c=Math.cos(t), k=1+s*s; return [a*c/k, sy*a*s*c/k]; };
  const box=[Infinity,Infinity,-Infinity,-Infinity];
  const path=(o,t0,t1,n)=>'M'+Array.from({length:n+1},(_,i)=>{ const t=t0+(t1-t0)*i/n, [x,y]=pt(t), [x2,y2]=pt(t+1e-4), L=Math.hypot(x2-x,y2-y);
    const X=256+x-(y2-y)/L*o, Y=256+y+(x2-x)/L*o;
    box[0]=Math.min(box[0],X); box[1]=Math.min(box[1],Y); box[2]=Math.max(box[2],X); box[3]=Math.max(box[3],Y);
    return X.toFixed(1)+','+Y.toFixed(1); }).join('L');
  const T=3*Math.PI/2, seg=(o,d)=>path(o,T-d,T+d,24), full=o=>path(o,0,2*Math.PI,160)+'Z';
  const st=(d,c,w,cap)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="${cap||'round'}" stroke-linejoin="round"/>`;
  const strands=st(full(gap),'var(--a)',sw)+st(full(-gap),'var(--b)',sw);
  const m=sw/2+2, vb=[box[0]-m, box[1]-m, box[2]-box[0]+2*m, box[3]-box[1]+2*m].map(v=>v.toFixed(1)).join(' ');
  return `<svg class="${cls}" viewBox="${vb}" aria-hidden="true"><defs><mask id="elo-${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><rect width="512" height="512" fill="#fff"/>${st(seg(gap,.34),'#000',sw+24,'butt')+st(seg(-gap,.34),'#000',sw+24,'butt')}</mask></defs>
    <g mask="url(#elo-${id})">${strands}</g>${st(seg(gap,.42),'var(--a)',sw,'butt')+st(seg(-gap,.42),'var(--b)',sw,'butt')}</svg>`;
}

    <div class="card stat"><div class="eyebrow">Clima médio</div><div class="v">${fmt1(M.clima)}<small> / 5</small></div><div class="s">${delta==null?'Média das 9 áreas':`<span class="${delta>=0?'up':'down'}">${delta>=0?'↑':'↓'} ${fmt1(Math.abs(delta))}</span> vs semana anterior`}</div></div>

function homeExtras(){

  html += `<div class="card"><div class="card-h"><h3>Reconhecimentos recentes</h3><button class="tiny muted" onclick="go('mais','reconhecimentos')">Todos ›</button></div>

    <button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="newRecognition()">+ Reconhecer algo</button></div>`;

function signals(M, last){
  const out=[];
  const sig=(c,ic,t,p)=>out.push(`<div class="signal ${c}"><span class="ic">${ic}</span><div><b>${t}</b><p>${p}</p></div></div>`);
  const moods=[last.entries.p0.mood,last.entries.p1.mood];
  if(moods.includes(1)) sig('alert','🌧️','Alguém chegou em crise nesta semana','Antes de olhar números, acolham. Combinem uma conversa curta, sem resolver tudo de uma vez.');
  M.dims.filter(d=>d.mean<=2).slice(0,3).forEach(d=>sig('alert','●',`${d.name} está baixa para os dois`,'Escolham uma ação pequena e concreta para os próximos 7 dias.'));
  M.dims.filter(d=>d.gap>=2).slice(0,3).forEach(d=>sig('warn','↔',`${d.name}: diferença de percepção de ${d.gap} pontos`,'Existe uma diferença importante nesta área. Conversem para entender o motivo — sem decidir quem está certo.'));
  const unresolved=S.conflicts.filter(c=>!c.repairedAt);
  if(unresolved.length) sig('warn','⟲',`${unresolved.length} conflito${unresolved.length>1?'s':''} sem reparação`,'Voltar a conversar depois da briga é o que mais protege a relação.');
  const overdue=S.actions.filter(a=>a.status!=='done'&&a.due&&a.due<todayISO());
  if(overdue.length) sig('warn','⏱',`${overdue.length} ação${overdue.length>1?'ões':''} com prazo vencido`,'Revejam juntos: ajustar o prazo também é progresso.');
  const {pos,neg}=positiveRatio(30);
  if(neg>0 && pos < neg*5) sig('info','⚖️',`Equilíbrio positivo: ${pos} reconhecimento${pos===1?'':'s'} para ${neg} conflito${neg===1?'':'s'} (30 dias)`,'Casais estáveis costumam ter muito mais momentos positivos do que negativos. Registrem o que funciona.');
  const lastRec=[...S.recognitions].sort((a,b)=>b.at.localeCompare(a.at))[0];
  if(!lastRec || daysBetween(lastRec.at, new Date())>7) sig('info','✦','Nenhum reconhecimento há mais de 7 dias','Uma frase de gratidão muda o clima da casa.');
  if(!out.length) sig('good','✓','Nenhum sinal de alerta nesta semana','Continuem cuidando do que está funcionando.');
  return out.join('');
}

}

function startDraft(edit, silent){
  const wk=isoWeek(), r=S.rounds[wk], ex=r&&r.entries&&r.entries[me];
  draft = edit&&ex ? JSON.parse(JSON.stringify(ex)) : {mood:null,factors:[],scores:{},notes:{},safety:{},understand:'',recognize:'',at:null};
  draft.step = 0;
  if(!silent) render();
}
const STEPS=['Como você chega','Áreas da relação','Segurança','Mensagens'];
function checkinStep(){
  const st=draft.step;
  let body='';
  if(st===0){
    body=`<h2>Como você está chegando nesta semana?</h2>
    <div class="moods">${MOODS.map(m=>`<button class="mood ${draft.mood===m.id?'on':''}" onclick="draft.mood=${m.id};render()"><span class="e">${m.e}</span>${m.t}</button>`).join('')}</div>
    <label class="f" style="margin-top:22px">O que mais influenciou isso? <span class="muted" style="font-weight:400">(uma ou mais)</span></label>
    <div class="chips">${FACTORS.map(f=>`<button class="chip ${draft.factors.includes(f)?'on':''}" onclick="toggleFactor('${f}')">${f}</button>`).join('')}</div>`;
  }
  if(st===1){
    body=`<h2>Como cada área esteve nesta semana?</h2><p class="small muted" style="margin-top:4px">Responda pelo que você viveu, não pelo que acha que o outro vai responder.</p>
    ${DIMS.map((d,i)=>`<div class="card flat" style="margin-top:12px">
      <div class="row between"><h3>${i+1}. ${d.name}</h3><span class="tiny muted">${draft.scores[d.id]?SCALE_LABELS[draft.scores[d.id]]:''}</span></div>
      <p class="small muted" style="margin-top:4px">${d.desc}</p>
      <ul class="hints">${d.hints.map(h=>`<li>${h}</li>`).join('')}</ul>
      <div class="scale">${[1,2,3,4,5].map(n=>`<button class="${draft.scores[d.id]===n?'on':''}" onclick="setScore('${d.id}',${n})">${n}</button>`).join('')}</div>
      <div class="scale-legend"><span>Muito difícil</span><span>Muito bem</span></div>
      <textarea class="in" style="min-height:52px;margin-top:10px" placeholder="Comentário (opcional, o outro verá)" oninput="draft.notes['${d.id}']=this.value">${esc(draft.notes[d.id]||'')}</textarea>
    </div>`).join('')}`;
  }
  if(st===2){
    body=`<h2>Segurança</h2><p class="small muted" style="margin-top:4px">🔒 Estas respostas são <b>só suas</b>. O outro não vê. Elas servem para o ELO te mostrar ajuda, se precisar.</p>
    ${SAFETY_Q.map(q=>`<div class="card flat" style="margin-top:12px"><p class="small" style="font-weight:600">${q.q}</p>
      <div class="yn"><button class="y ${draft.safety[q.id]===true?'on':''}" onclick="draft.safety['${q.id}']=true;render()">Sim</button><button class="n ${draft.safety[q.id]===false?'on':''}" onclick="draft.safety['${q.id}']=false;render()">Não</button></div></div>`).join('')}`;
  }
  if(st===3){
    body=`<h2>Duas mensagens</h2>
    <label class="f">O que você gostaria que ${esc(nameOf(other(me)))} entendesse nesta semana?</label>
    <textarea class="in" placeholder="Fale de você: “eu me senti…”, “eu preciso de…”" oninput="draft.understand=this.value">${esc(draft.understand)}</textarea>
    <p class="tiny muted" style="margin-top:6px">Dica: frases que começam com “eu” são ouvidas; frases com “você sempre/nunca” viram defesa.</p>
    <label class="f">Uma coisa que você reconhece e valoriza em ${esc(nameOf(other(me)))}</label>
    <textarea class="in" placeholder="Algo concreto desta semana, por menor que seja" oninput="draft.recognize=this.value">${esc(draft.recognize)}</textarea>
    <p class="tiny muted" style="margin-top:6px">O reconhecimento também vai para o mural de reconhecimentos.</p>`;
  }
  const canNext = st===0 ? !!draft.mood : st===1 ? DIMS.every(d=>draft.scores[d.id]) : st===2 ? SAFETY_Q.every(q=>typeof draft.safety[q.id]==='boolean') : true;
  return `<section class="hero" style="padding-bottom:0"><div class="row between"><span class="eyebrow">Passo ${st+1} de ${STEPS.length} · ${STEPS[st]}</span>${st>0?`<button class="tiny muted" style="white-space:nowrap;flex:none" onclick="draft.step--;render();scrollTo(0,0)">‹ Voltar</button>`:''}</div>
    <div class="progress"><i style="width:${(st+1)/STEPS.length*100}%"></i></div></section>
    ${body}
    <div style="margin:22px 0">${st<STEPS.length-1
      ? `<button class="btn btn-primary btn-block" ${canNext?'':'disabled'} onclick="draft.step++;render();scrollTo(0,0)">Continuar</button>
         ${st===1&&!canNext?`<p class="tiny muted" style="text-align:center;margin-top:8px">Faltam ${DIMS.filter(d=>!draft.scores[d.id]).length} áreas</p>`:''}`
      : `<button class="btn btn-primary btn-block" onclick="submitCheckin()">Enviar meu check-in</button>`}
      <button class="btn btn-block" style="margin-top:6px;color:var(--muted)" onclick="draft=null;go('home')">Cancelar</button></div>`;
}
function toggleFactor(f){ const i=draft.factors.indexOf(f); i>=0?draft.factors.splice(i,1):draft.factors.push(f); render(); }
function setScore(id,n){
  draft.scores[id]=n;
  const y=window.scrollY; render(); window.scrollTo(0,y);
}
function submitCheckin(){
  const wk=isoWeek();
  if(!S.rounds[wk]) S.rounds[wk]={id:wk,week:wk,entries:{}};
  const {step,...entry}=draft;
  const wasNew=!S.rounds[wk].entries[me];
  entry.at=new Date().toISOString();
  S.rounds[wk].entries[me]=entry;
  if(entry.recognize && entry.recognize.trim() && (wasNew || !S.recognitions.some(r=>r.week===wk&&r.from===me))){
    S.recognitions.push({id:uid(),from:me,text:entry.recognize.trim(),at:entry.at,week:wk});
  }
  save(); draft=null; sub=null;
  toast('Check-in salvo ✓'); go('checkin');
  if(CLOUD) Cloud.queue.then(()=>Cloud.refresh());
}

/* ---------- Evolução ---------- */
function viewEvolucao(){
  const rs=completeRounds();
  let html=`<section class="hero"><div class="eyebrow">Histórico</div><h1>Estamos melhorando?</h1><p>Tendências valem mais do que uma semana isolada.</p></section>`;
  if(rs.length<1) return html+`<div class="card flat empty">O histórico começa a aparecer depois da primeira semana com os dois check-ins completos.</div>`;
  html+=`<div class="seg" style="margin-top:8px">${[[4,'1 mês'],[13,'3 meses'],[26,'6 meses'],[999,'Tudo']].map(([n,t])=>`<button class="${histPeriod===n?'on':''}" onclick="histPeriod=${n};render()">${t}</button>`).join('')}</div>
  <div class="card"><div class="card-h"><h3>Evolução</h3>
    <select class="in" style="width:auto;max-width:55%;height:38px;padding:6px 32px 6px 12px" onchange="histDim=this.value;render()">
      <option value="all" ${histDim==='all'?'selected':''}>Clima geral</option>
      ${DIMS.map(d=>`<option value="${d.id}" ${histDim===d.id?'selected':''}>${d.short}</option>`).join('')}
    </select></div>
    <div class="chart-box" style="height:240px"><canvas id="hist"></canvas></div></div>`;
  html+=`<div class="card"><div class="card-h"><h3>Tendência por área</h3><span class="tiny muted">últimas 4 semanas</span></div>
    ${DIMS.map(d=>{ const t=trendFor(d.id,4); const vals=rs.slice(-4).map(r=>roundMetrics(r).dims.find(x=>x.id===d.id).mean);
      return `<div class="list-item row between"><div><b class="small">${d.name}</b><div class="tiny muted">${vals.map(fmt1).join(' → ')}</div></div><span class="pill ${t.cls}">${t.label}</span></div>`; }).join('')}
  </div>`;
  html+=`<div class="card"><div class="card-h"><h3>Como cada um chegou</h3></div>
    ${rs.slice(-8).reverse().map(r=>`<div class="list-item row between"><span class="small">${weekLabel(r.week)}</span><span>${['p0','p1'].map(p=>`<span class="pill ${cls(p)}" title="${esc(nameOf(p))}">${MOODS.find(m=>m.id===r.entries[p].mood)?.e||'·'} ${esc(initial(p))}</span>`).join(' ')}</span></div>`).join('')}
  </div>`;
  return html;
}
function drawHistory(){
  const el=$('#hist'); if(!el||!window.Chart) return;
  const rs=completeRounds().slice(-histPeriod);
  const pick=(r,p)=> histDim==='all' ? avg(DIMS.map(d=>r.entries[p].scores[d.id])) : r.entries[p].scores[histDim];
  const ca=css('--a'), cb=css('--b'), grid=css('--line'), txt=css('--muted');
  charts.push(new Chart(el,{type:'line',data:{labels:rs.map(r=>weekLabel(r.week).split(' – ')[0]),datasets:[
    {label:nameOf('p0'),data:rs.map(r=>pick(r,'p0')),borderColor:ca,backgroundColor:ca,tension:.35,borderWidth:2.5,pointRadius:3},
    {label:nameOf('p1'),data:rs.map(r=>pick(r,'p1')),borderColor:cb,backgroundColor:cb,tension:.35,borderWidth:2.5,pointRadius:3}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      scales:{y:{min:1,max:5,ticks:{stepSize:1,color:txt},grid:{color:grid}},x:{ticks:{color:txt},grid:{display:false}}},
      plugins:{legend:{position:'bottom',labels:{color:txt,usePointStyle:true,boxWidth:8,font:{family:'Inter'}}},
        tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmt1(c.parsed.y)}`}}}}}));
}

/* ---------- Ações ---------- */
const STATUS={todo:'Não iniciada',doing:'Em andamento',done:'Concluída'};
function viewAcoes(){
  const open=S.actions.filter(a=>a.status!=='done'), done=S.actions.filter(a=>a.status==='done');
  return `<section class="hero"><div class="eyebrow">Planos de ação</div><h1>Pequenas atitudes, toda semana</h1><p>Uma ação boa é concreta, curta e possível. “20 minutos sem celular, 3 vezes” funciona melhor do que “conversar mais”.</p></section>
  <button class="btn btn-primary btn-block" onclick="newAction()">+ Nova ação</button>
  <div class="card"><div class="card-h"><h3>Abertas</h3><span class="pill">${open.length}</span></div>${open.length?open.map(a=>actionRow(a,true)).join(''):'<div class="empty">Nenhuma ação aberta.</div>'}</div>
  ${done.length?`<div class="card"><div class="card-h"><h3>Concluídas</h3><span class="pill good">${done.length}</span></div>${done.slice().reverse().map(a=>actionRow(a,true)).join('')}</div>`:''}`;
}
function actionRow(a, full){
  const dim=DIMS.find(d=>d.id===a.dim);
  const who=a.owner==='both'?'Ambos':nameOf(a.owner);
  const late=a.status!=='done'&&a.due&&a.due<todayISO();
  return `<div class="list-item">
    <div class="row between"><span class="eyebrow">${esc(dim?dim.short:'Geral')}</span><span class="pill ${a.status==='done'?'good':late?'alert':a.status==='doing'?'a':''}">${late?'Atrasada':STATUS[a.status]}</span></div>
    <div style="font-weight:600;margin-top:4px">${esc(a.action)}</div>
    ${full&&a.goal?`<div class="small muted">Objetivo: ${esc(a.goal)}</div>`:''}
    ${full&&a.problem?`<div class="small muted">Percebido: ${esc(a.problem)}</div>`:''}
    <div class="tiny muted" style="margin-top:4px">${esc(who)}${a.due?` · até ${fmtDate(a.due)}`:''}${a.doneAt?` · concluída em ${fmtDate(a.doneAt)}`:''}</div>
    ${full?`<div class="row" style="margin-top:10px;flex-wrap:wrap">
      ${a.status!=='doing'&&a.status!=='done'?`<button class="btn btn-ghost btn-sm" onclick="setStatus('${a.id}','doing')">Começar</button>`:''}
      ${a.status!=='done'?`<button class="btn btn-ghost btn-sm" onclick="setStatus('${a.id}','done')">Concluir ✓</button>`:`<button class="btn btn-ghost btn-sm" onclick="setStatus('${a.id}','doing')">Reabrir</button>`}
      <button class="btn btn-sm" style="color:var(--muted)" onclick="delAction('${a.id}')">Excluir</button></div>`:''}
  </div>`;
}
/* Exemplos da "Nova ação" para cada área: [o que percebemos, objetivo, ação concreta] */

function actionExamples(dimId){
  const [p,g,a]=ACTION_EX[dimId]||ACTION_EX[''];
  $('#a-prob').placeholder='Ex.: '+p; $('#a-goal').placeholder='Ex.: '+g; $('#a-act').placeholder='Ex.: '+a;
}
function newAction(dimId){
  modal(`<h2>Nova ação</h2>
    <label class="f">Área</label><select class="in" id="a-dim" onchange="actionExamples(this.value)"><option value="">Geral</option>${DIMS.map(d=>`<option value="${d.id}" ${d.id===dimId?'selected':''}>${d.name}</option>`).join('')}</select>
    <label class="f">O que percebemos</label><textarea class="in short" id="a-prob" rows="2"></textarea>
    <label class="f">Objetivo</label><textarea class="in short" id="a-goal" rows="2"></textarea>
    <label class="f">Ação concreta</label><textarea class="in short" id="a-act" rows="2"></textarea>
    <label class="f">Responsável</label><select class="in" id="a-own"><option value="both">Ambos</option><option value="p0">${esc(nameOf('p0'))}</option><option value="p1">${esc(nameOf('p1'))}</option></select>
    <label class="f">Prazo</label><input class="in" type="date" id="a-due" value="${localISO(new Date(Date.now()+7*864e5))}">
    <button class="btn btn-primary btn-block" style="margin-top:18px" onclick="saveAction()">Salvar ação</button>`);
  actionExamples(dimId||'');
}
function saveAction(){
  const act=$('#a-act').value.trim(); if(!act) return toast('Descreva a ação');
  S.actions.push({id:uid(),dim:$('#a-dim').value,problem:$('#a-prob').value.trim(),goal:$('#a-goal').value.trim(),action:act,owner:$('#a-own').value,due:$('#a-due').value,status:'todo',createdAt:new Date().toISOString(),createdBy:me,doneAt:null});
  save(); closeModal(); toast('Ação criada'); render();
}
function setStatus(id,st){ const a=S.actions.find(x=>x.id===id); a.status=st; a.doneAt=st==='done'?todayISO():null; save(); render(); }
function delAction(id){ if(!confirm('Excluir esta ação?')) return; S.actions=S.actions.filter(a=>a.id!==id); save(); render(); }

/* ---------- Mais ---------- */
function viewMais(){

  if(sub==='conflitos') return viewConflicts();

  if(sub==='privado') return viewPrivate();
  if(sub==='config') return viewConfig();
  if(sub==='ajuda') return `<button class="back" onclick="go('mais')">‹ Mais</button><section class="hero"><h1>Ajuda profissional</h1><p>Um painel ajuda a enxergar; não substitui cuidado especializado.</p></section>${safetyCard()}
    <div class="card"><h3>Terapia de casal</h3><p class="small muted" style="margin-top:6px">Quando a mesma briga se repete, quando há feridas de confiança (como uma traição) ou quando se fala em separação, um terapeuta de casal dá o espaço neutro que um aplicativo não dá. Clínicas-escola de psicologia das universidades costumam oferecer atendimento a preço social.</p></div>
    <div class="card"><h3>Para as crianças</h3><p class="small muted" style="margin-top:6px">Crianças sentem o clima da casa mesmo quando não entendem as palavras. Evitem discutir na frente delas, nunca as coloquem como mensageiras e reforcem que elas não têm culpa pelos conflitos dos adultos.</p></div>`;

    ['reconhecimentos','✦','Reconhecimentos','O mural do que está funcionando'],
    ['conflitos','⟲','Conflitos e reparação','Registrar, pausar e voltar a conversar'],
    ['ritual','☕','Ritual semanal','Roteiro da conversa de 30 minutos'],
    ['privado','🔒',`Meu espaço`,`Diário privado de ${nameOf(me)}`],
    ['ajuda','☎','Ajuda profissional','Contatos e orientações'],
    ['config','⚙','Configurações',CLOUD?'Nomes, convite, conta e backup':'Nomes, PIN, backup e sincronização']
  ];
  return `<section class="hero"><h1>Mais</h1></section><div class="card menu">${items.map(([id,ic,t,s])=>`<button onclick="go('mais','${id}')"><span class="mi">${ic}</span><span class="mt"><b>${esc(t)}</b><span>${esc(s)}</span></span>›</button>`).join('')}</div>
  <p class="tiny muted" style="text-align:center;margin:18px 0">ELO ${APP_VERSION} · Dois caminhos, um só elo.</p>`;
}
function recRow(r){ return `<div class="list-item"><div class="row between"><span class="pill wrap ${cls(r.from)}">${esc(nameOf(r.from))} → ${esc(nameOf(other(r.from)))}</span><span class="tiny muted">${fmtDate(r.at)}</span></div><div class="small" style="margin-top:6px">${esc(r.text)}</div></div>`; }
function viewRecs(){
  const {pos,neg}=positiveRatio(30);

  return `<button class="back" onclick="go('mais')">‹ Mais</button><section class="hero"><h1>Reconhecimentos</h1><p>O ELO não é um detector de defeitos. Aqui fica o que cada um percebeu de bom no outro.</p></section>

  <div class="card stat"><div class="eyebrow">Equilíbrio</div><div class="v">${neg?(pos/neg).toFixed(1).replace('.',','):'—'}<small>${neg?' : 1':''}</small></div><div class="s">positivos por conflito (meta 5:1)</div></div></div>
  <button class="btn btn-primary btn-block" onclick="newRecognition()">+ Reconhecer ${esc(nameOf(other(me)))}</button>
  <div class="card">${list.length?list.map(recRow).join(''):'<div class="empty">Ainda vazio.</div>'}</div>`;

function newRecognition(){
  modal(`<h2>Reconhecer ${esc(nameOf(other(me)))}</h2><p class="small muted">Algo concreto que ${esc(nameOf(other(me)))} fez e que você valoriza.</p>
    <textarea class="in" id="rec-t" style="margin-top:12px" placeholder="Ex.: obrigado por ter buscado as meninas quando eu me atrasei"></textarea>

function saveRec(){ const t=$('#rec-t').value.trim(); if(!t) return; S.recognitions.push({id:uid(),from:me,text:t,at:new Date().toISOString()}); save(); closeModal(); toast('Reconhecimento registrado ✦'); render(); }

  const list=[...S.conflicts].sort((a,b)=>b.date.localeCompare(a.date));

  <div class="card stack"><h3>Pausa combinada</h3><p class="small muted">Quando a voz subir: qualquer um pode dizer <b>“pausa”</b>. Os dois param, se afastam por 20 a 30 minutos (o corpo precisa desse tempo para desacelerar) e quem pediu a pausa é quem chama de volta. Nada de sair batendo porta nem de retomar na frente das crianças.</p></div>
  <button class="btn btn-primary btn-block" onclick="newConflict()">+ Registrar conflito</button>
  <div class="card">${list.length?list.map(c=>`<div class="list-item">
    <div class="row between"><b class="small">${esc(c.topic)}</b><span class="pill ${c.repairedAt?'good':'warn'}">${c.repairedAt?'Reparado':'Em aberto'}</span></div>
    <div class="tiny muted">${fmtDate(c.date)} · intensidade ${['','leve','média','forte'][c.intensity]}${c.pause?' · usamos a pausa':''}${c.kids?' · crianças presentes':''}</div>
    ${c.learned?`<div class="comment">O que ajudou: ${esc(c.learned)}</div>`:''}
    ${!c.repairedAt?`<button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="repair('${c.id}')">Marcar como reparado</button>`:''}

}
function newConflict(){
  modal(`<h2>Registrar conflito</h2><p class="small muted">Descreva o tema, não o culpado.</p>
    <label class="f">Tema</label><input class="in" id="c-t" placeholder="Ex.: divisão das tarefas no fim de semana">
    <label class="f">Data</label><input class="in" type="date" id="c-d" value="${todayISO()}">
    <label class="f">Intensidade</label><div class="seg" id="c-i">${[1,2,3].map(n=>`<button class="${n===2?'on':''}" data-v="${n}" onclick="[...this.parentNode.children].forEach(b=>b.classList.remove('on'));this.classList.add('on')">${['','Leve','Média','Forte'][n]}</button>`).join('')}</div>
    <label class="check"><input type="checkbox" id="c-p"><span>Conseguimos usar a pausa combinada</span></label>
    <label class="check"><input type="checkbox" id="c-k"><span>Aconteceu na frente das crianças</span></label>
    <button class="btn btn-primary btn-block" style="margin-top:10px" onclick="saveConflict()">Registrar</button>`);
}
function saveConflict(){
  const t=$('#c-t').value.trim(); if(!t) return toast('Descreva o tema');
  S.conflicts.push({id:uid(),topic:t,date:$('#c-d').value||todayISO(),intensity:+document.querySelector('#c-i .on').dataset.v,pause:$('#c-p').checked,kids:$('#c-k').checked,by:me,repairedAt:null,learned:''});
  save(); closeModal(); render();
}
function repair(id){
  modal(`<h2>Reparação</h2><p class="small muted">O que ajudou vocês a voltarem a conversar?</p>
    <textarea class="in" id="r-l" style="margin-top:12px" placeholder="Ex.: pedi desculpas pelo tom e ela explicou o que estava sentindo"></textarea>
    <button class="btn btn-primary btn-block" style="margin-top:14px" onclick="saveRepair('${id}')">Marcar como reparado</button>`);
}
function saveRepair(id){ const c=S.conflicts.find(x=>x.id===id); c.repairedAt=todayISO(); c.learned=$('#r-l').value.trim(); save(); closeModal(); toast('Reparação registrada'); render(); }

function viewRitual(){
  return `<button class="back" onclick="go('mais')">‹ Mais</button><section class="hero"><h1>Ritual semanal</h1><p>30 minutos, uma vez por semana, sem celular e longe das crianças. Não é uma DR — é a reunião do time.</p></section>
  <div class="card"><ol class="steps">
    <li><b>Apreciação (5 min).</b> Cada um diz duas coisas que o outro fez bem na semana.</li>
    <li><b>O que está bem (5 min).</b> Olhem juntos as áreas que subiram ou estão estáveis.</li>
    <li><b>Uma diferença (10 min).</b> Escolham só <i>um</i> gap de percepção. Um fala, o outro repete com as próprias palavras o que entendeu antes de responder.</li>
    <li><b>Uma ação (5 min).</b> Criem uma única ação pequena para a próxima semana.</li>
    <li><b>Fechamento (5 min).</b> Combinem algo bom para fazer juntos até o próximo ritual.</li>
  </ol></div>
  <div class="card"><h3>Combinados que protegem a conversa</h3><ul class="hints" style="font-size:14px;margin-top:10px">
    <li>Falar de si (“eu senti”) em vez de acusar (“você sempre”).</li>
    <li>Um assunto por vez; o passado entra só se for para reparar.</li>
    <li>Crítica ao comportamento, nunca à pessoa.</li>
    <li>Se a voz subir, usar a pausa combinada.</li>
    <li>Terminar com um toque, um abraço ou um obrigado.</li>
  </ul></div>`;
}

function viewPrivate(){
  const list=(S.private[me]||[]).slice().reverse();
  return `<button class="back" onclick="go('mais')">‹ Mais</button><section class="hero"><h1>Meu espaço</h1><p>Só ${esc(nameOf(me))} vê o que está aqui. Use para organizar o que sente antes de levar para a conversa.${CLOUD||S.partners[me==='p0'?0:1].pin?'':' <b>Dica:</b> defina um PIN em Configurações para proteger este espaço.'}</p></section>
  <div class="card"><textarea class="in" id="pv" placeholder="Como estou me sentindo, o que me machucou, o que eu preciso…"></textarea>
  <button class="btn btn-primary btn-block" style="margin-top:12px" onclick="savePrivate()">Guardar</button></div>
  <div class="card">${list.length?list.map(e=>`<div class="list-item"><div class="row between"><span class="tiny muted">${fmtDate(e.at)}</span><button class="tiny muted" onclick="delPrivate('${e.id}')">excluir</button></div><div class="small" style="margin-top:4px;white-space:pre-wrap">${esc(e.text)}</div></div>`).join(''):'<div class="empty">Nenhuma anotação.</div>'}</div>`;
}
function savePrivate(){ const t=$('#pv').value.trim(); if(!t) return; (S.private[me]=S.private[me]||[]).push({id:uid(),text:t,at:new Date().toISOString()}); save(); render(); }
function delPrivate(id){ if(!confirm('Excluir esta anotação?')) return; S.private[me]=S.private[me].filter(e=>e.id!==id); save(); render(); }

/* ---------- Configurações, backup e sincronização ---------- */
function viewConfig(){
  const i=me==='p0'?0:1;
  if(CLOUD) return `<button class="back" onclick="go('mais')">‹ Mais</button><section class="hero"><h1>Configurações</h1></section>
  <div class="card"><h3>Nomes</h3>
    <label class="f">Parceiro 1</label><input class="in" id="cfg0" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" value="${esc(S.partners[0].name)}">
    <label class="f">Parceiro 2</label><input class="in" id="cfg1" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" value="${esc(S.partners[1].name)}">
    <button class="btn btn-ghost btn-block" style="margin-top:12px" onclick="saveNames()">Salvar nomes</button></div>
  ${inviteCard()}
  <div class="card"><h3>Conta</h3><p class="small muted" style="margin-top:4px">Conectado como ${esc(Cloud.user.email)}. Os dados sincronizam automaticamente entre os dois celulares.</p>
    <button class="btn btn-ghost btn-block" style="margin-top:12px" onclick="newPasswordModal()">Trocar senha</button>
    <button class="btn btn-block" style="margin-top:6px;color:var(--muted)" onclick="sb.auth.signOut()">Sair da conta</button></div>
  <div class="card"><h3>Backup</h3><p class="small muted" style="margin-top:4px">Baixe uma cópia dos dados do casal, ou importe um arquivo exportado da versão sem nuvem (só os seus check-ins são enviados).</p>
    <div class="stack" style="margin-top:12px">
      <button class="btn btn-ghost btn-block" onclick="exportData()">Exportar arquivo</button>
      <label class="btn btn-line btn-block">Importar e mesclar<input type="file" accept="application/json,.json" class="hidden" onchange="importData(this)"></label>
    </div></div>`;
  return `<button class="back" onclick="go('mais')">‹ Mais</button><section class="hero"><h1>Configurações</h1></section>
  <div class="card"><h3>Nomes</h3>
    <label class="f">Parceiro 1</label><input class="in" id="cfg0" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" value="${esc(S.partners[0].name)}">
    <label class="f">Parceiro 2</label><input class="in" id="cfg1" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" value="${esc(S.partners[1].name)}">
    <button class="btn btn-ghost btn-block" style="margin-top:12px" onclick="saveNames()">Salvar nomes</button></div>
  <div class="card"><h3>PIN de ${esc(nameOf(me))}</h3><p class="small muted" style="margin-top:4px">Protege seu espaço privado quando os dois usam o mesmo aparelho.</p>
    <div class="row" style="margin-top:12px">${S.partners[i].pin?`<button class="btn btn-ghost btn-sm" onclick="setPin()">Trocar PIN</button><button class="btn btn-sm" style="color:var(--muted)" onclick="clearPin()">Remover</button>`:`<button class="btn btn-ghost btn-sm" onclick="setPin()">Definir PIN</button>`}</div></div>
  <div class="card"><h3>Usar em dois celulares</h3>
    <p class="small muted" style="margin-top:4px">Nesta versão, cada aparelho guarda seus dados. Para juntar os check-ins: exporte o arquivo de sincronização em um celular e importe no outro (pelo WhatsApp, AirDrop ou e-mail). Anotações de “Meu espaço” nunca vão no arquivo. Com o Supabase, isso passa a ser automático.</p>
    <div class="stack" style="margin-top:12px">
      <button class="btn btn-ghost btn-block" onclick="exportData()">Exportar arquivo de sincronização</button>
      <label class="btn btn-line btn-block">Importar e mesclar<input type="file" accept="application/json,.json" class="hidden" onchange="importData(this)"></label>
    </div></div>
  <div class="card"><h3>Apagar dados</h3><p class="small muted" style="margin-top:4px">Remove tudo deste aparelho. Não pode ser desfeito.</p>
    <button class="btn btn-sm" style="margin-top:10px;color:var(--alert)" onclick="resetAll()">Apagar tudo deste aparelho</button></div>`;
}
function saveNames(){ const a=$('#cfg0').value.trim(), b=$('#cfg1').value.trim(); if(!a||!b) return toast('Os nomes não podem ficar vazios'); S.partners[0].name=a; S.partners[1].name=b; save(); toast('Nomes salvos'); render(); }
function setPin(){
  modal(`<h2>Novo PIN</h2><p class="small muted">4 dígitos que só você saiba.</p><div class="pin">${[0,1,2,3].map(i=>`<input inputmode="numeric" maxlength="1" type="password">`).join('')}</div>
    <button class="btn btn-primary btn-block" onclick="savePin()">Salvar PIN</button>`); wirePin();
}
async function savePin(){ const v=pinValue(); if(v.length!==4) return toast('Digite os 4 dígitos'); S.partners[me==='p0'?0:1].pin=await sha(v); save(); closeModal(); toast('PIN definido'); render(); }
function clearPin(){ S.partners[me==='p0'?0:1].pin=null; save(); render(); }
function exportData(){
  const {private:_, ...shared}=S;
  shared.partners=S.partners.map(p=>({name:p.name,pin:null}));
  // não exportar respostas de segurança (são privadas)
  shared.rounds=JSON.parse(JSON.stringify(S.rounds));
  Object.values(shared.rounds).forEach(r=>{ Object.entries(r.entries).forEach(([p,e])=>{ if(e.hidden) delete r.entries[p]; else delete e.safety; }); });
  const blob=new Blob([JSON.stringify({elo:APP_VERSION,exportedAt:new Date().toISOString(),data:shared},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`elo-sync-${todayISO()}.json`; document.body.appendChild(a); a.click(); a.remove();
  toast('Arquivo exportado');
}
function importData(input){
  const f=input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const d=JSON.parse(rd.result).data; if(!d||!d.rounds) throw 0;
    Object.values(d.rounds).filter(r=>r&&validWeek(r.week)&&r.entries).forEach(r=>{
      const cur=S.rounds[r.week]||(S.rounds[r.week]={id:r.week,week:r.week,entries:{}});
      ['p0','p1'].forEach(p=>{ const inc=r.entries[p]; if(!inc||inc.hidden) return; const ex=cur.entries[p];
        if(!ex || (inc.at||'')>(ex.at||'')) cur.entries[p]={...inc, safety: ex?ex.safety:undefined}; });
    });
    const mergeArr=(k)=>{ const map=new Map(S[k].map(x=>[x.id,x])); (d[k]||[]).filter(x=>x&&validId(x.id)).forEach(x=>{ const ex=map.get(x.id); if(!ex) map.set(x.id,x); else if(k==='actions'&&x.status==='done'&&ex.status!=='done') map.set(x.id,x); else if(k==='conflicts'&&x.repairedAt&&!ex.repairedAt) map.set(x.id,x); }); S[k]=[...map.values()]; };
    ['actions','recognitions','conflicts'].forEach(mergeArr);
    if(!S.onboarded && d.partners){ S.partners=d.partners.map(p=>({name:p.name,pin:null})); S.onboarded=true; }
    save(); toast('Dados mesclados ✓'); render();
  }catch(e){ toast('Arquivo inválido'); } };
  rd.readAsText(f);
}
function resetAll(){ if(!confirm('Apagar todos os dados do ELO deste aparelho?')) return; if(!confirm('Tem certeza? Não dá para desfazer.')) return; try{localStorage.removeItem(STORAGE_KEY);localStorage.removeItem('elo.me');}catch(e){} S=Store.blank(); me=null; view='home'; render(); }

/* ---------- Início ---------- */
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>render());
render();
if(CLOUD) Cloud.init();
</script>
</body>
</html>
